<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wake Log</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; width: 360px; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    #support { color: #555; margin: 0 0 10px; }
    ol { list-style: none; margin: 0; padding: 0; max-height: 380px; overflow-y: auto; }
    li { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid #eee; }
    li.quiet { color: #999; }
    li.pattern { color: #5b8c5a; }
    time { color: #777; font-variant-numeric: tabular-nums; min-width: 64px; }
    code { font-weight: 600; }
    button { margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Wake Log</h1>
  <p id="support"></p>
  <ol id="log"></ol>
  <button id="clear" type="button">Clear log</button>
  <script src="popup.js"></script>
</body>
</html>
