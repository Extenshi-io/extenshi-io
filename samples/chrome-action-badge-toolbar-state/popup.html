<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Tab Pulse</title>
	<style>
		body {
			width: 260px;
			margin: 0;
			padding: 14px;
			font-family: system-ui, sans-serif;
			color: #1f1b16;
			background: #ffffff;
		}
		h1 { margin: 0 0 8px; font-size: 15px; }
		p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
		button {
			width: 100%;
			padding: 8px 10px;
			border: 1px solid #fb5b1a;
			border-radius: 8px;
			background: #ffffff;
			color: #fb5b1a;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #fb5b1a; color: #ffffff; }
		code { font-size: 12px; }
	</style>
</head>
<body>
	<h1>Tab Pulse</h1>
	<p id="count">…</p>
	<button id="click-mode">Back to click mode</button>
	<p><code>setPopup({ popup: '' })</code> hands the button back to <code>onClicked</code> — no reload.</p>
	<script src="popup.js"></script>
</body>
</html>
